name: Run Playwright Tests

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "The release version to use"
        required: true
        default: "2.0.0"
      wp_version:
        description: "WordPress version, such as 6.6. Empty for the latest. Below 6.9 only the Chrome passes run."
        required: false
        default: ""

jobs:
  test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    env:
      SO_TESTS_WP_VERSION: ${{ github.event.inputs.wp_version }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install Dependencies
      run: npm ci
    - name: Check the WordPress Version
      run: node -e "require( 'siteorigin-tests-common/playground/wordPressVersion' )()"
    - name: Test the Runner's Pass Selection
      run: npm run test:scripts
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Install Build Dependencies & Make Build
      run: |
        cd build
        export RELEASE_VERSION=${{ github.event.inputs.release_version }}
        npm install && npm run build:release
    - name: Run Tests
      run: npm run tests
