name: WPML Config
on:
  push:
    paths:
      - wpml-config.xml
      - tests/WpmlConfigTest.php
      - .github/workflows/wpml-config.yml
  pull_request:
    paths:
      - wpml-config.xml
      - tests/WpmlConfigTest.php
      - .github/workflows/wpml-config.yml
permissions:
  contents: read
jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpunit tests/WpmlConfigTest.php
